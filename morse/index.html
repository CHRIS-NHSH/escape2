<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>摩斯密碼燈 — 互動解謎機關</title>
<style>
  :root {
    --bg-color: #121619;
    --panel-bg: #1e2429;
    --border-color: #343e46;
    --text-main: #e8ecef;
    --text-muted: #9aa5b1;
    --accent-amber: #ffb703;
    --accent-amber-glow: rgba(255, 183, 3, 0.65);
    --accent-green: #2ec4b6;
    --accent-green-glow: rgba(46, 196, 182, 0.55);
    --accent-red: #e63946;
    --accent-red-glow: rgba(230, 57, 70, 0.55);
    --btn-bg: #2b333b;
    --btn-hover: #38424d;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    line-height: 1.5;
  }

  .terminal-container {
    width: 100%;
    max-width: 540px;
    background-color: var(--panel-bg);
    border: 2px solid var(--border-color);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 12px;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 1.25rem;
    margin: 0;
    letter-spacing: 1px;
    color: var(--accent-amber);
  }

  .status-badge {
    font-size: 0.85rem;
    padding: 4px 10px;
    border-radius: 20px;
    background-color: var(--btn-bg);
    border: 1px solid var(--border-color);
    font-weight: bold;
  }

  .status-badge.unlocked {
    background-color: rgba(46, 196, 182, 0.15);
    border-color: var(--accent-green);
    color: var(--accent-green);
  }

  .story-box {
    background-color: rgba(0, 0, 0, 0.25);
    border-left: 4px solid var(--accent-amber);
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 0.95rem;
    margin-bottom: 18px;
    color: var(--text-main);
  }

  /* 信號燈區域 */
  .signal-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #14181c;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 20px 16px;
    margin-bottom: 18px;
  }

  .lamp-housing {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background-color: #23292e;
    border: 4px solid #3c464f;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 14px;
    box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.8);
  }

  .lamp-bulb {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background-color: #3a321d;
    transition: background-color 0.05s ease, box-shadow 0.05s ease;
  }

  .lamp-bulb.active {
    background-color: var(--accent-amber);
    box-shadow: 0 0 28px 8px var(--accent-amber-glow);
  }

  .lamp-bulb.solved {
    background-color: var(--accent-green);
    box-shadow: 0 0 28px 8px var(--accent-green-glow);
  }

  .lamp-bulb.error {
    background-color: var(--accent-red);
    box-shadow: 0 0 28px 8px var(--accent-red-glow);
  }

  .signal-indicator-text {
    font-size: 0.9rem;
    color: var(--text-muted);
    min-height: 1.4em;
    margin-bottom: 12px;
    font-family: monospace;
  }

  .controls-row {
    display: flex;
    gap: 10px;
    width: 100%;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    cursor: pointer;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background-color: var(--btn-bg);
    color: var(--text-main);
    touch-action: manipulation;
    transition: background-color 0.15s, transform 0.1s;
  }

  button:active:not(:disabled) {
    transform: scale(0.97);
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn-primary {
    background-color: var(--accent-amber);
    color: #121619;
    border-color: var(--accent-amber);
  }

  .btn-primary:hover:not(:disabled) {
    background-color: #ffc93c;
  }

  .btn-submit {
    background-color: var(--accent-green);
    color: #0d1b1e;
    border-color: var(--accent-green);
    width: 100%;
    padding: 12px;
    font-size: 1.05rem;
  }

  .btn-submit:hover:not(:disabled) {
    background-color: #45d9cb;
  }

  /* 輸入區域 */
  .input-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  .input-label {
    font-size: 0.9rem;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1.25rem;
    font-family: monospace;
    letter-spacing: 3px;
    text-transform: uppercase;
    background-color: #121619;
    border: 2px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-main);
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--accent-amber);
  }

  input[type="text"]:disabled {
    opacity: 0.6;
    background-color: #1a2024;
  }

  /* 回饋訊息區 */
  .feedback-box {
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 16px;
    display: none;
  }

  .feedback-box.visible {
    display: block;
  }

  .feedback-box.error {
    background-color: rgba(230, 57, 70, 0.15);
    border: 1px solid var(--accent-red);
    color: #ff8fa3;
  }

  .feedback-box.warning {
    background-color: rgba(255, 183, 3, 0.15);
    border: 1px solid var(--accent-amber);
    color: #ffd166;
  }

  .feedback-box.success {
    background-color: rgba(46, 196, 182, 0.15);
    border: 1px solid var(--accent-green);
    color: #80ffdb;
  }

  .clue-card {
    margin-top: 12px;
    padding: 12px;
    background-color: rgba(0, 0, 0, 0.35);
    border-radius: 6px;
    border: 1px dashed var(--accent-green);
    color: #ffffff;
  }

  .clue-card img {
    max-width: 100%;
    border-radius: 6px;
    margin-top: 8px;
    display: block;
  }

  /* 輔助工具列（提示與對照表） */
  .tools-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .tools-row button {
    flex: 1;
    font-size: 0.9rem;
    padding: 8px 12px;
  }

  .hint-panel, .chart-panel {
    background-color: #14181c;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 14px;
    display: none;
    font-size: 0.9rem;
  }

  .hint-panel.visible, .chart-panel.visible {
    display: block;
  }

  .hint-item {
    padding: 6px 0;
    border-bottom: 1px solid #252c33;
  }

  .hint-item:last-child {
    border-bottom
